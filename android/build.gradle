group = "com.dev.gcimia.radio_service"
version = "1.0-SNAPSHOT"

buildscript {
    ext.kotlin_version = "2.2.20"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.11.1")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"


android {
    namespace = "com.dev.gcimia.radio_service"

    compileSdk = 37

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        minSdk = 24  // Android 7.0 — minimum recommandé
    }

    dependencies {
        testImplementation("org.jetbrains.kotlin:kotlin-test")
        testImplementation("org.mockito:mockito-core:5.0.0")

        // AndroidX Core — fournit ContextCompat.startForegroundService(),
        // ServiceCompat.stopForeground() et autres compat API multi-version
        implementation("androidx.core:core-ktx:1.13.1")

        implementation("androidx.media3:media3-exoplayer:1.6.1")
        implementation("androidx.media3:media3-exoplayer-hls:1.6.1")
        implementation("androidx.media3:media3-datasource:1.6.1")
        implementation("androidx.media3:media3-session:1.6.1")
        implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
                events "passed", "skipped", "failed", "standardOut", "standardError"
                outputs.upToDateWhen {false}
                showStandardStreams = true
            }
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
    }
}
