group = "com.dev.gcimia.radio_service"
version = "1.0-SNAPSHOT"

// État supporté par Flutter 3.44.6 (android.builtInKotlin=false) :
// le plugin applique le Kotlin Gradle Plugin de façon classique (legacy),
// ce qui fonctionne grâce au support temporaire KGP de Flutter sous AGP 9.
// Versions alignées sur le trio testé par Flutter 3.44.6 : AGP 9.2.1 / KGP 2.4.10.
// NB : la migration "built-in Kotlin" du plugin (suppression de ce buildscript
// + retrait de kotlin-android) ne pourra être activée qu'une fois le projet
// passé en android.builtInKotlin=true, ce qui suppose des plugins embarqués
// (integration_test) compatibles — pas le cas en 3.44.6.

buildscript {
    ext.kotlin_version = "2.4.10"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:9.2.1")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"

android {
    namespace = "com.dev.gcimia.radio_service"

    compileSdk = 37

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        minSdk = 24  // Android 7.0 — minimum recommandé
    }

    dependencies {
        def media3_version = "1.10.1"

        testImplementation("org.jetbrains.kotlin:kotlin-test")
        testImplementation("org.mockito:mockito-core:5.23.0")

        // AndroidX Core — fournit ContextCompat.startForegroundService(),
        // ServiceCompat.stopForeground() et autres compat API multi-version
        implementation("androidx.core:core-ktx:1.19.0")

        implementation("androidx.media3:media3-exoplayer:$media3_version")
        implementation("androidx.media3:media3-exoplayer-hls:$media3_version")
        implementation("androidx.media3:media3-datasource:$media3_version")
        implementation("androidx.media3:media3-session:$media3_version")
        implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0")
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
                events "passed", "skipped", "failed", "standardOut", "standardError"
                outputs.upToDateWhen {false}
                showStandardStreams = true
            }
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
    }
}
