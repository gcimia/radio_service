org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError

# Seul drapeau booléen qui reste, et il est obligatoire.
android.useAndroidX=true

# Retirés dans le lot v0.1.6 :
#
#   android.enableJetifier=true
#       Jetifier réécrit les dépendances pré-AndroidX (com.android.support.*).
#       Le projet n'en a aucune — vérifié sur l'app et sur le plugin. Il ne
#       faisait que ralentir chaque build.
#
#   android.builtInKotlin=false
#   android.newDsl=false
#       Deux échappatoires posées automatiquement par le migrateur Flutter.
#       AGP 9 les met à true par défaut et AGP 10 supprime la possibilité de
#       s'en extraire. Le passage à Flutter 3.47 débloque le Kotlin intégré,
#       et rien dans le build n'utilisait l'ancien DSL.
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
